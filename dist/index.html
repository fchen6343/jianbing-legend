<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#34271f">
<title>煎饼摊传奇 · 街角烟火</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#241e19;color:#ffdf9f;font-family:system-ui}body{display:grid;place-items:center;background:radial-gradient(ellipse at center,#594431,#241e19 75%)}#game-shell{position:relative;width:min(100vw,177.777vh);height:min(56.25vw,100vh);box-shadow:0 0 80px #0008}canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}#toolbar{position:absolute;right:1.6%;top:3.5%;display:flex;gap:6px}#toolbar button{border:1px solid #efddb344;border-radius:9px;background:#48392deF;color:#fff0cc;min-width:clamp(26px,3vw,38px);height:clamp(28px,3.2vw,39px);padding:0 9px;cursor:pointer;font:600 clamp(10px,1.05vw,13px) system-ui;box-shadow:0 3px 8px #20140e33;transition:background .15s,transform .15s}#toolbar button:hover{background:#805436;transform:translateY(-1px)}#toolbar button:focus-visible{outline:2px solid #ffe0a2;outline-offset:3px}#toolbar button:disabled{opacity:.45;cursor:default;transform:none}#orientation{display:none}#accessible{position:absolute;left:-9999px}@media(orientation:portrait){#orientation{display:block;position:fixed;bottom:14px;left:10px;right:10px;text-align:center;font-size:13px;color:#e3c29a}#toolbar{gap:3px}#toolbar button{padding:0 5px}}
#management{position:absolute;right:1.6%;top:13%;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:23%}#management button,dialog button{font:600 13px system-ui;background:#805239;color:#fff5dd;border:1px solid #c59d6d;border-radius:8px;padding:9px 12px;cursor:pointer}#management button{font-size:clamp(9px,1vw,13px);padding:6px 9px}button:disabled{opacity:.45;cursor:default}dialog{width:min(920px,94vw);max-height:90vh;overflow:auto;border:1px solid #d6b788;border-radius:20px;padding:25px;background:#fff5df;color:#563c2b;box-shadow:0 15px 100px #0008}dialog::backdrop{background:#21190edb}dialog h2{margin:0}dialog p{line-height:1.5;font-size:13px}dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-25px;padding:12px 0;background:#fff5df;z-index:1}.shop-balance{font-weight:bold;font-size:19px!important}.shop-settings{display:grid;grid-template-columns:1fr 1fr;gap:20px}.decor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.decor-grid article{background:#efdfbd;border-radius:12px;padding:15px}.decor-grid h3{font-size:16px}.festival-tabs{display:flex;gap:8px;flex-wrap:wrap}button[aria-pressed=true]{background:#b95d38!important}#save-status{position:fixed;bottom:0;background:#6d312b;color:white;font-size:12px;margin:0}@media(max-width:600px){.decor-grid{grid-template-columns:1fr 1fr}.shop-settings{grid-template-columns:1fr}dialog{padding:15px}dialog header{top:-15px}}
#decor-preview{width:100%;max-width:640px;aspect-ratio:16/9;height:auto;border-radius:12px;display:block;touch-action:auto}button{touch-action:manipulation}dialog button{min-height:44px}#management button{min-height:32px}</style>
<main id="game-shell"><canvas id="game" width="1280" height="720" aria-label="煎饼摊传奇：点击食材、拖动摊饼、点击工具和顾客" tabindex="0"></canvas><nav id="toolbar" aria-label="Game controls"><button id="language" type="button" aria-label="Switch to English">EN / 中文</button><button id="sound" type="button" aria-label="关闭声音">♪</button><button id="pause" type="button" aria-label="暂停" disabled>Ⅱ</button></nav><nav id="management"><button id="mode-open" type="button">普通模式 ▾</button><button id="shop-open" type="button">装饰与经营</button><button id="learn" type="button">新手教程</button></nav></main><dialog id="shop-dialog" aria-labelledby="shop-title"><header><h2 id="shop-title">装饰与经营</h2><button id="shop-close" type="button">返回煎饼摊</button></header><div id="shop-body"></div></dialog><p id="save-status" role="status"></p>
<p id="orientation">横屏体验更好，转动手机后再开摊</p><p id="accessible">鼠标或触屏操作。点击面糊，绕圈摊开。点蛋盘拿蛋，在饼上敲开并向左或右拉开蛋壳，从蛋黄开始摊匀；再点蛋盘可放回未打开的蛋。随后翻面、加料、刷酱、折叠、装袋、点击顾客交餐。点击老板补货，点击偷吃的夹子阻止偷吃。</p><script type="module" src="./js/main.js"></script></html>
