<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>煎饼摊传奇 · 街角烟火</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#251b19;color:#ffdf9f;font-family:system-ui}body{display:grid;place-items:center}canvas{width:min(100vw,177.777vh);height:min(56.25vw,100vh);display:block;touch-action:none;box-shadow:0 0 70px #0008}#language{position:fixed;left:14px;bottom:12px;z-index:2;border:1px solid #ffe0a0;border-radius:8px;background:#452b22;color:#fff0cc;padding:9px 12px;cursor:pointer;font:14px system-ui}#language:focus-visible{outline:3px solid #fff}#accessible{position:absolute;left:-9999px}</style><button id="language" type="button" aria-label="Switch to English">English / 中文</button><canvas id="game" width="1280" height="720" aria-label="煎饼摊传奇：点击食材、拖动摊饼、点击工具和顾客" tabindex="0"></canvas><p id="accessible">鼠标或触屏操作。点击面糊，在铁板上拖动摊饼，加蛋后点击铲子翻面，添加订单配料并拖动刷酱，折叠、装袋后点击顾客。点击老板补货，点击偷吃的手阻止偷吃。</p><script type="module" src="./js/main.js"></script></html>
